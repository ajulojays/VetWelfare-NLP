[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vetwelfare-nlp"
version = "0.5.0"
description = "Evidence-grounded NLP for Five-Domains animal-welfare signal extraction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Samuel O. Ajulo"}]
dependencies = [
  "click>=8.1",
  "pandas>=2.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2", "twine>=5.0"]
annotator = ["streamlit>=1.40"]
platform = [
  "streamlit>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
]
transformers = [
  "torch>=2.2",
  "transformers>=4.48",
  "datasets>=3.0",
  "accelerate>=1.0",
  "evaluate>=0.4",
  "huggingface-hub>=0.27",
  "safetensors>=0.4",
  "wandb>=0.18",
]
all = [
  "streamlit>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "torch>=2.2",
  "transformers>=4.48",
  "datasets>=3.0",
  "accelerate>=1.0",
  "evaluate>=0.4",
  "huggingface-hub>=0.27",
  "safetensors>=0.4",
  "wandb>=0.18",
  "pytest>=8",
  "ruff>=0.5",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
vetwelfare = "vetwelfare_nlp.cli:main"
vetwelfare-fetch = "vetwelfare_nlp.fetch_dataset:main"
vetwelfare-audit = "vetwelfare_nlp.audit_dataset:main"
vetwelfare-sample-annotation = "vetwelfare_nlp.sample_annotation:main"
vetwelfare-prepare-annotation = "vetwelfare_nlp.prepare_annotation:main"
vetwelfare-download-models = "vetwelfare_nlp.download_models:main"
vetwelfare-train-baseline = "vetwelfare_nlp.train_baseline:main"
vetwelfare-train-transformer = "vetwelfare_nlp.train_transformer:main"
vetwelfare-annotate = "vetwelfare_nlp.launch_annotator:main"
vetwelfare-seed-platform = "vetwelfare_nlp.platform.seed:main"
vetwelfare-model-prefill = "vetwelfare_nlp.model_prefill:main"
vetwelfare-model-agreement = "vetwelfare_nlp.model_agreement:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
